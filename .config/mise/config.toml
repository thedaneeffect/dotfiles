# mise configuration for dotfiles repository
# See: https://mise.jdx.dev/configuration.html

[tools]
"cargo:tokei" = "latest"
"cargo:procs" = "latest"
"go:github.com/docker/docker-language-server/cmd/docker-language-server" = "latest"
"go:github.com/go-delve/delve/cmd/dlv" = "latest"
# Note: secrets CLI installed via go install in setup.sh (local source)
# Can optionally enable this if/when published to GitHub:
# "go:github.com/thedaneeffect/dotfiles/cmd/secrets" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"golangci-lint-langserver"="latest"
"npm:bash-language-server" = "latest"
"npm:typescript-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"
air = "latest"
ast-grep = "latest"
bat = "latest"
bun = "latest"
delta = "latest"
# dust = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
go = "latest"
gofumpt = "latest"
golangci-lint = "latest"
golines = "latest"
# grex = "latest"
helix = "latest"
jq = "latest"
marksman = "latest"
ripgrep = "latest"
rust = "latest"
sd = "latest"
starship = "latest"
taplo = "latest"
yq = "latest"
zellij = "latest"
zig = "latest"
zls = "latest"
zoxide = "latest"
cargo-binstall = "latest"
node = "latest"
tlrc = "latest"
grex = "latest"
dust = "latest"
"go:code.gitea.io/tea" = "HEAD"
"cargo:git-absorb" = "latest"
"npm:svelte-language-server" = "latest"
ffmpeg = "latest"
flatc = "25.1.21"
python = "latest"
wrangler = "latest"

[env]
# Project-specific environment variables
# (General shell env like XDG is in .zshrc)
GOPATH = "{{ env.HOME }}/go"
GO111MODULE = "on"

[settings]
# Automatically install tools when entering directory
auto_install = true

# Experimental features
experimental = true

# Legacy version file support (.nvmrc, .node-version, etc.)
legacy_version_file = true

[settings.npm]
bun = true

[settings.cargo]
binstall = true
