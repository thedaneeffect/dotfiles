# ── multi-client geometry ────────────────────────────────────────────────────
# Local iTerm2 and remote SSH are peer clients of the same server. 'smallest' would
# shrink every window to the worst-sized client; 'latest' follows whoever acted last.
#
# aggressive-resize stays unset on purpose. Per tmux(1) it only alters the
# 'smallest'/'largest' modes, so under 'latest' it buys nothing — and iTerm2's -CC
# integration rejects it, because control mode assigns each window its geometry via
# `refresh-client -C @win:WxH` and can't have tmux recomputing sizes underneath it.
set -g window-size latest
set -g detach-on-destroy off

# ── window identity ──────────────────────────────────────────────────────────
# Stable names matter here: they're what survives a resurrect restore, and what
# both clients use to refer to the same window.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename off

set -g history-limit 50000

# ── server PATH ──────────────────────────────────────────────────────────────
# The server inherits PATH from whatever launched it, and iTerm2's tmux integration
# spawns it without login-shell PATH — leaving /opt/homebrew/bin off. Plugin scripts
# invoked via run-shell call `tmux` themselves, so without this every resurrect save
# exits 127 and writes a 0-byte file. Panes are unaffected either way; they rebuild
# PATH from .zshenv/.zshrc.
set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# ── OSC passthrough ──────────────────────────────────────────────────────────
# tmux parses pane output and drops OSC sequences it doesn't implement, so
# iTerm2-specific ones (OSC 1337 SetProfile in the .zshrc claude() wrapper) never
# reach the terminal. This enables the DCS `\ePtmux;…\e\\` escape hatch that
# forwards a payload verbatim to the outer terminal.
set -g allow-passthrough on

# ── reboot persistence ───────────────────────────────────────────────────────
# Restores sessions/windows/panes/layouts/cwd. Processes are NOT restored unless
# whitelisted via @resurrect-processes.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Must stay the last line, and must be invoked directly — wrapping it in if-shell
# stops tpm exporting TMUX_PLUGIN_MANAGER_PATH, which breaks bin/install_plugins.
# setup.sh clones tpm, so treat it as a hard dependency rather than guarding for it.
run '~/.tmux/plugins/tpm/tpm'
